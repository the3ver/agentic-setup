name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -S error skills/tighten-the-loop/inventory.sh tests/smoke.sh
      - name: Smoke-Test
        run: bash tests/smoke.sh
